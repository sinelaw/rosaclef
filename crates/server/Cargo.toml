[package]
name = "rosaclef"
description = "Rosaclef studio: native server, audio engine host and command line tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rosaclef"
path = "src/main.rs"

[features]
default = ["device-audio"]
# Real-time playback and recording through the system audio device (cpal).
device-audio = ["dep:cpal"]

[dependencies]
rosaclef-core.workspace = true
rosaclef-engine = { workspace = true, features = ["parallel"] }
rosaclef-fs.workspace = true
rosaclef-studio.workspace = true
rosaclef-clap = { path = "../clap-host" }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
rosaclef-import.workspace = true
clap = { version = "4", features = ["derive"] }
notify = "6"
portable-pty = "0.9"
parking_lot = "0.12"
futures-util = "0.3"
which = "7"
getrandom = "0.3"
cpal = { version = "0.15", optional = true }
