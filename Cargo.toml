[workspace]
resolver = "2"
members = ["crates/core", "crates/engine", "crates/fs", "crates/studio", "crates/wasm", "crates/local", "crates/server", "crates/clap-host", "crates/clap-testplug", "crates/import", "crates/phonetics", "crates/vocal"]
default-members = ["crates/core", "crates/engine", "crates/fs", "crates/studio", "crates/server", "crates/clap-host", "crates/import", "crates/phonetics", "crates/vocal"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/sinelaw/rosaclef"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
rosaclef-core = { path = "crates/core" }
rosaclef-engine = { path = "crates/engine" }
rosaclef-import = { path = "crates/import" }
rosaclef-phonetics = { path = "crates/phonetics" }
rosaclef-vocal = { path = "crates/vocal" }
rosaclef-fs = { path = "crates/fs" }
rosaclef-studio = { path = "crates/studio" }

[profile.release]
opt-level = 3
lto = "thin"

[profile.release.package.rosaclef-wasm]
opt-level = 3

# The WebAssembly modules (tools/build-wasm.sh): small, with the DSP at full speed.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.wasm.package.rosaclef-engine]
opt-level = 3

[profile.wasm.package.rosaclef-wasm]
opt-level = 3
