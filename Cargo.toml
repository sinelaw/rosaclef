[workspace]
resolver = "2"
members = ["crates/core", "crates/engine", "crates/wasm", "crates/server", "crates/clap-host", "crates/clap-testplug", "crates/import"]
default-members = ["crates/core", "crates/engine", "crates/server", "crates/clap-host", "crates/import"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/sinelaw/rosaclef"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
rosaclef-core = { path = "crates/core" }
rosaclef-engine = { path = "crates/engine" }
rosaclef-import = { path = "crates/import" }

[profile.release]
opt-level = 3
lto = "thin"

[profile.release.package.rosaclef-wasm]
opt-level = 3
